name: Nhịp Điệu Xanh CI/CD Pipeline

# Legacy pipeline for the private nhipdieuxanh client project (apps/ is not in
# this public repo), so it can never pass on push/PR here. Kept for reference
# but only runs on manual dispatch.
on:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_FRONTEND: mekong/ndx-frontend
  IMAGE_BACKEND: mekong/ndx-backend
  IMAGE_AI: mekong/ndx-ai
  KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
  KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}

jobs:
  # --- STAGE 1: LINT & TEST ---
  test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint --filter=@mekong/nhipdieuxanh-landing --filter=nhipdieuxanh

      - name: Run Next.js Build (Pre-compile Check)
        run: |
          pnpm --filter nhipdieuxanh run build

  # --- STAGE 2: BUILD & PUSH DOCKER IMAGES ---
  build-and-push:
    name: Build & Push Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/nhipdieuxanh
          file: ./apps/nhipdieuxanh-orchestrator/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/nhipdieuxanh
          file: ./apps/nhipdieuxanh-orchestrator/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push AI Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/nhipdieuxanh-orchestrator/mock-services/ai-service
          file: ./apps/nhipdieuxanh-orchestrator/docker/Dockerfile.ai
          push: true
          tags: |
            ${{ env.IMAGE_AI }}:${{ github.sha }}
            ${{ env.IMAGE_AI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_FRONTEND }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_BACKEND }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # --- STAGE 3: DEPLOY TO STAGING (AUTO) ---
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Configure Kubernetes Config (Staging)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config

      - name: Helm Deploy to Staging Namespace
        run: |
          helm upgrade --install ndx-staging ./apps/nhipdieuxanh-orchestrator/helm/nhipdieuxanh \
            --namespace ndx-staging --create-namespace \
            --set image.frontend.tag=${{ github.sha }} \
            --set image.backend.tag=${{ github.sha }} \
            --set image.ai.tag=${{ github.sha }} \
            --set ingress.hosts[0].host="staging.nhipdieuxanh.vn" \
            --values ./apps/nhipdieuxanh-orchestrator/helm/nhipdieuxanh/values.yaml

  # --- STAGE 3.5: WEB SECURITY SCAN (OWASP ZAP) ---
  security-scan:
    name: OWASP ZAP Security Scan
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://staging.nhipdieuxanh.vn'
          allow_issue_writing: false
          fail_action: false

  # --- STAGE 4: DEPLOY TO PRODUCTION (MANUAL GATE) ---
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging, security-scan]
    runs-on: ubuntu-latest
    environment:
      name: production # Enables GitHub manual review & approval workflow
      url: https://nhipdieuxanh.vn
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Configure Kubernetes Config (Production)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > ~/.kube/config

      - name: Helm Deploy to Production (Rolling Update)
        run: |
          helm upgrade --install ndx-prod ./apps/nhipdieuxanh-orchestrator/helm/nhipdieuxanh \
            --namespace ndx-prod --create-namespace \
            --set image.frontend.tag=${{ github.sha }} \
            --set image.backend.tag=${{ github.sha }} \
            --set image.ai.tag=${{ github.sha }} \
            --set ingress.hosts[0].host="nhipdieuxanh.vn" \
            --values ./apps/nhipdieuxanh-orchestrator/helm/nhipdieuxanh/values.yaml
