<!DOCTYPE html><html><head><meta charset="utf-8"><title>Over-carded</title>
<style>
body{font-family:Inter,sans-serif;background:#fff;color:#111}
.wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px;transition:all 0.2s ease}
.card:hover{transform:scale(1.02)}
.card .icon{font-size:1.5rem}
</style></head><body><div class="wrap">
<script>for(let i=0;i<24;i++)document.write('<div class="card"><div class="icon">✦</div><h4>Card</h4><p>Detail text.</p></div>')</script>
</div></body></html>
