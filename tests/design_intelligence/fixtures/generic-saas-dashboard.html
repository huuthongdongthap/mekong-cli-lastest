<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dashboard</title>
<style>
:root{--font:'Inter',sans-serif}
body{font-family:Inter,sans-serif;background:#f5f5f5;color:#111}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:24px}
.card h3{font-size:1.1rem;margin:0 0 8px}
.stat{font-size:2rem;font-weight:700}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid #eee}
</style></head><body>
<nav><div>Logo</div><a href="#pricing">Pricing</a><button>Sign in</button></nav>
<div class="grid"><div class="card"><h3>Users</h3><div class="stat">1,240</div></div>
<div class="card"><h3>Revenue</h3><div class="stat">$12k</div></div>
<div class="card"><h3>Churn</h3><div class="stat">2.1%</div></div>
<div class="card"><h3>ARR</h3><div class="stat">$148k</div></div>
<div class="card"><h3>Leads</h3><div class="stat">312</div></div>
<div class="card"><h3>Conv</h3><div class="stat">4.3%</div></div></div>
</body></html>
