<!DOCTYPE html><html><head><meta charset="utf-8"><title>AI Startup</title>
<style>
:root{--p1:linear-gradient(135deg,#7c3aed,#ec4899);--p2:linear-gradient(135deg,#6366f1,#06b6d4)}
body{font-family:'Poppins',sans-serif;background:var(--p1);color:#fff;min-height:100vh}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:120px 24px}
.hero h1{font-size:4rem;font-weight:800;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.25rem;max-width:600px}
.btn{background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff;border:none;padding:16px 40px;border-radius:999px;font-size:1.1rem;transition:all 0.3s ease}
.btn:hover{transform:scale(1.05)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding:80px 40px}
.feature{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:16px;padding:32px;text-align:center}
</style></head><body><div class="hero"><h1>Unleash Seamless AI</h1><p>The future of productivity.</p><button class="btn">Start free</button></div>
<div class="features"><div class="feature"><h3>Fast</h3><p>10x faster.</p></div><div class="feature"><h3>Beautiful</h3><p>Pixel-perfect.</p></div><div class="feature"><h3>Powerful</h3><p>99.9% uptime.</p></div></div></body></html>
